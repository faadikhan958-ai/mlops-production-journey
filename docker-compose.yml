
services:
  api:
    build: ./fastapi-docker-mlops
    ports:
      - "${HOST_PORT:-8000}:${API_PORT:-8000}"
    environment:
      API_PORT: "${API_PORT:-8000}"
      MODEL_PATH: "${MODEL_PATH:-models/dummy_car_model.pkl}"
    networks:
      - mlops-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  model_inference:
    build: ./model-inference
    ports:
      - "8001:8001"
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
