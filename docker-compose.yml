
services:
  # FastAPI Service
  api:
    build: ./fastapi-docker-mlops
    ports:
      - "${HOST_PORT:-8000}:${API_PORT:-8000}"
    environment:
      API_PORT: "${API_PORT:-8000}"
      MODEL_PATH: "${MODEL_PATH:-models/dummy_car_model.pkl}"
    networks:
      - mlops-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Heavy ML Model Service
  model_inference:
    image: python:3.9-slim
    command: tail -f /dev/null
    networks:
      - mlops-network

# Custom Bridge Network

networks:
  mlops-network:
    driver: bridge
