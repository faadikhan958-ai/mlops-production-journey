
services:
  # FastAPI Service
  api:
    build: ./fastapi-docker-mlops
    ports:
      - "${HOST_PORT:-8000}:${API_PORT:-8000}"
    environment:
      API_PORT: "${API_PORT:-8000}"
      MODEL_PATH: "${MODEL_PATH:-models/dummy_car_model.pkl}"
    networks:
      - mlops-network

  # Heavy ML Model Service
  model_inference:
    image: python:3.9-slim
    command: tail -f /dev/null
    networks:
      - mlops-network

# Custom Bridge Network
networks:
  mlops-network:
    driver: bridge
